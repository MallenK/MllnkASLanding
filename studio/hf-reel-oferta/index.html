<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root { --bg:#111111; --white:#ffffff; --cream:#f7f3e8; --gold:#ffd21f; --sans:"Montserrat", ui-sans-serif, system-ui, sans-serif; }
      * { margin:0; padding:0; box-sizing:border-box; }
      html, body { margin:0; width:1080px; height:1920px; overflow:hidden; background:var(--bg); }
      #root { width:100%; height:100%; position:relative; overflow:hidden; background:var(--bg); font-family:var(--sans); }
      #bg { position:absolute; inset:0; overflow:hidden; }
      .glow { position:absolute; border-radius:50%; }
      #g1 { width:1400px; height:1400px; left:-700px; top:1220px; background:radial-gradient(circle, rgba(255,210,31,0.20) 0%, rgba(255,210,31,0) 65%); }
      #g2 { width:1100px; height:1100px; left:500px; top:-520px; background:radial-gradient(circle, rgba(247,243,232,0.07) 0%, rgba(247,243,232,0) 65%); }
      #logo { position:absolute; left:100px; top:296px; width:190px; }
      .scene { position:absolute; inset:0; opacity:0; }
      .block { position:absolute; left:100px; width:840px; font-weight:800; letter-spacing:-0.02em; }
      .hook { top:560px; font-size:88px; line-height:1.1; color:var(--white); }
      .cta { top:640px; font-size:84px; line-height:1.12; color:var(--gold); }
      .big { position:absolute; left:100px; width:840px; top:640px; font-weight:800; font-size:84px; line-height:1.12; letter-spacing:-0.02em; color:var(--white); }
      .big.gold { color:var(--gold); }
      .tag { position:absolute; left:100px; top:470px; padding:14px 30px; border-radius:999px; background:var(--gold); color:#000; font-weight:800; font-size:32px; letter-spacing:0.18em; text-transform:uppercase; }
      .w { display:inline-block; }
      .accent { color:var(--gold); }
      .cap { position:absolute; left:60px; width:960px; top:400px; height:180px; display:flex; align-items:center; font-weight:800; font-size:60px; line-height:1.12; letter-spacing:-0.02em; color:var(--gold); opacity:0; }
      #frame { position:absolute; left:40px; top:610px; width:1000px; height:780px; overflow:hidden; border-radius:28px; border:4px solid rgba(255,210,31,0.9); box-shadow:0 30px 90px rgba(0,0,0,0.55); background:#fff; opacity:0; }
      #zoom { position:absolute; left:0; top:0; width:1440px; height:900px; transform-origin:0 0; }
      #clip { position:absolute; left:0; top:0; width:1440px; height:900px; object-fit:cover; }
      #note { position:absolute; left:40px; width:1000px; top:1420px; text-align:center; font-weight:700; font-size:28px; letter-spacing:0.06em; color:rgba(247,243,232,0.6); opacity:0; }
      #sign { position:absolute; left:100px; top:1260px; width:420px; }
      
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="19.4" data-width="1080" data-height="1920">
      <div id="bg" class="clip" data-layout-allow-overflow data-start="0" data-duration="19.4" data-track-index="0">
        <div id="g1" class="glow"></div>
        <div id="g2" class="glow"></div>
      </div>
      <div id="logowrap" class="clip" data-start="0" data-duration="19.4" data-track-index="2"><img id="logo" src="assets/brand/urpa-logo.png" alt="URPA"></div>
      <div id="content" class="clip" data-start="0" data-duration="19.4" data-track-index="1">
        <div id="hook" class="scene">
          <div class="tag">Escuelas de fútbol</div>
          <h1 class="block hook"><span class="w">Busco</span> <span class="w">2</span> <span class="w">escuelas</span> <span class="w">de</span> <span class="w">fútbol</span> <span class="w">para</span> <span class="w">trabajar</span> <span class="w">juntas</span></h1>
        </div>
        <div class="scene" id="tx0"><p class="big gold"><span class="w">30</span> <span class="w">días</span> <span class="w">con</span> <span class="w">URPA,</span> <span class="w">acompañado</span> <span class="w">por</span> <span class="w">mí</span></p></div>
        <div class="scene" id="tx1"><p class="big"><span class="w">Cargamos</span> <span class="w">tus</span> <span class="w">equipos</span> <span class="w">juntos</span> <span class="w">el</span> <span class="w">primer</span> <span class="w">día</span></p></div>
        <div class="scene" id="tx2"><p class="big"><span class="w">Una</span> <span class="w">llamada</span> <span class="w">corta</span> <span class="w">cada</span> <span class="w">semana</span></p></div>
        <div class="scene" id="tx3"><p class="big gold"><span class="w">Al</span> <span class="w">final</span> <span class="w">decides</span> <span class="w">si</span> <span class="w">sigues,</span> <span class="w">a</span> <span class="w">precio</span> <span class="w">de</span> <span class="w">fundador</span></p></div>
        <div id="cta" class="scene">
          <p class="block cta"><span class="w">Escríbeme</span> <span class="w">por</span> <span class="w">DM</span> <span class="w">o</span> <span class="w">reserva</span> <span class="w">en</span> <span class="w">el</span> <span class="w">enlace</span> <span class="w">del</span> <span class="w">perfil</span></p>
          <img id="sign" src="assets/brand/urpa-logo.png" alt="URPA">
        </div>
      </div>
      
      <div id="caps">
        
      </div>
      <audio id="sfx1" src="assets/sfx/whoosh-short.mp3" data-start="2.6" data-duration="0.575" data-track-index="20" data-volume="0.5"></audio>
      <audio id="sfx2" src="assets/sfx/whoosh-short.mp3" data-start="5.8" data-duration="0.575" data-track-index="21" data-volume="0.45"></audio>
      <audio id="sfx3" src="assets/sfx/whoosh-short.mp3" data-start="9" data-duration="0.575" data-track-index="22" data-volume="0.45"></audio>
      <audio id="sfx4" src="assets/sfx/whoosh-short.mp3" data-start="12" data-duration="0.575" data-track-index="23" data-volume="0.45"></audio>
      <audio id="sfx5" src="assets/sfx/whoosh-short.mp3" data-start="15.8" data-duration="0.575" data-track-index="24" data-volume="0.5"></audio>
      <audio id="sfx6" src="assets/sfx/chime.mp3" data-start="16.8" data-duration="2" data-track-index="25" data-volume="0.4"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const HOOK = 2.8, FOOT_END = 16, TOTAL = 19.4;
      const show = (sel, t0, t1) => { tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, t0); tl.to(sel, { opacity: 0, duration: 0.18, ease: "power1.in" }, t1 - 0.18); };
      const words = (sel, t0) => tl.fromTo(sel + " .w", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.36, ease: "power3.out", stagger: 0.04 }, t0 + 0.05);

      show("#hook", 0, HOOK); words("#hook", 0);
      tl.fromTo("#hook .tag", { x: -60, opacity: 0 }, { x: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 0.05);
      
      show("#tx0", 2.8, 6); words("#tx0", 2.8);
      show("#tx1", 6, 9.2); words("#tx1", 6);
      show("#tx2", 9.2, 12.2); words("#tx2", 9.2);
      show("#tx3", 12.2, 16); words("#tx3", 12.2);

      // Cierre
      tl.fromTo("#cta", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, FOOT_END);
      words("#cta", FOOT_END);
      tl.fromTo("#sign", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, FOOT_END + 0.5);

      // Revisión QA: el logo fijo de arriba se retira cuando entra la firma de cierre (sin logo duplicado)
      tl.to("#logo", { opacity: 0, duration: 0.3, ease: "power1.in" }, FOOT_END + 0.5 - 0.1);
      tl.fromTo("#logo", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.05);
      tl.fromTo("#g1", { scale: 1, x: 0 }, { scale: 1.25, x: 80, duration: TOTAL, ease: "none" }, 0);
      tl.fromTo("#g2", { scale: 1, y: 0 }, { scale: 1.15, y: 90, duration: TOTAL, ease: "none" }, 0);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
